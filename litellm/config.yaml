# Drop-in LiteLLM Proxy configuration for TokenBuddy
# Docs: https://tokenbuddy.site/docs?article=sdks
# Set TOKENBUDDY_API_KEY in your environment before launching:
#   litellm --config ecosystem/litellm/config.yaml --port 4000

model_list:
  - model_name: claude-sonnet-4-5
    litellm_params:
      model: openai/claude-sonnet-4-5
      api_base: os.environ/TOKENBUDDY_BASE_URL
      api_key: os.environ/TOKENBUDDY_API_KEY
  - model_name: gpt-5
    litellm_params:
      model: openai/gpt-5
      api_base: os.environ/TOKENBUDDY_BASE_URL
      api_key: os.environ/TOKENBUDDY_API_KEY
  - model_name: gemini-2.5-pro
    litellm_params:
      model: openai/gemini-2.5-pro
      api_base: os.environ/TOKENBUDDY_BASE_URL
      api_key: os.environ/TOKENBUDDY_API_KEY
  - model_name: deepseek-v3
    litellm_params:
      model: openai/deepseek-v3
      api_base: os.environ/TOKENBUDDY_BASE_URL
      api_key: os.environ/TOKENBUDDY_API_KEY

general_settings:
  drop_params: true
