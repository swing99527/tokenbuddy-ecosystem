# Drop-in LiteLLM Proxy configuration for TokenBuddy
# Docs: https://tokenbuddy.site/docs?article=sdks
# Set TOKENBUDDY_API_KEY in your environment before launching:
#   litellm --config litellm/config.yaml --port 4000

model_list:
  - model_name: claude-sonnet-5-5
    litellm_params:
      model: openai/claude-sonnet-5-5
      api_base: os.environ/TOKENBUDDY_BASE_URL
      api_key: os.environ/TOKENBUDDY_API_KEY
  - model_name: gpt-6-sol
    litellm_params:
      model: openai/gpt-6-sol
      api_base: os.environ/TOKENBUDDY_BASE_URL
      api_key: os.environ/TOKENBUDDY_API_KEY
  - model_name: claude-opus-5-5
    litellm_params:
      model: openai/claude-opus-5-5
      api_base: os.environ/TOKENBUDDY_BASE_URL
      api_key: os.environ/TOKENBUDDY_API_KEY
  - model_name: deepseek-v4.1-flash-hx
    litellm_params:
      model: openai/deepseek-v4.1-flash-hx
      api_base: os.environ/TOKENBUDDY_BASE_URL
      api_key: os.environ/TOKENBUDDY_API_KEY

general_settings:
  drop_params: true
